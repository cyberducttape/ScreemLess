name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate installer and service activation scripts
        run: |
          bash -n install.sh tests/service_activation.sh
          bash -n packaging/render-service-unit.sh
          bash -n packaging/validate-service-install-dir.sh
          bash -n packaging/verify-release-version.sh tests/release_metadata.sh
          bash -n tests/package_artifacts.sh
          sh -n packaging/postinstall.sh packaging/service-activation.sh
          sh -n packaging/preremove.sh packaging/postremove.sh
          bash tests/service_activation.sh
          bash tests/package_removal.sh
          bash tests/installer_service_path.sh
          bash tests/release_metadata.sh

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Verify workload version probes are safe under root
        run: |
          set -euo pipefail
          test_binary=
          for candidate in target/debug/deps/screamless-*; do
            if [[ -x "$candidate" && ! -d "$candidate" ]]; then
              test_binary="$candidate"
              break
            fi
          done
          test -n "$test_binary"
          sudo -n env SCREAMLESS_REQUIRE_ROOT_TEST=1 \
            "$test_binary" --exact \
            collector::tests::software_inventory_never_executes_the_observed_executable

      - name: Verify collector under its bounded service capabilities
        run: |
          set -euo pipefail
          test_binary=
          for candidate in target/debug/deps/screamless-*; do
            if [[ -x "$candidate" && ! -d "$candidate" ]]; then
              test_binary="$candidate"
              break
            fi
          done
          test -n "$test_binary"
          sudo -n setpriv --bounding-set=-all,+dac_read_search,+net_admin,+sys_ptrace \
            env SCREAMLESS_REQUIRE_ROOT_TEST=1 "$test_binary" --exact \
            collector::tests::software_inventory_never_executes_the_observed_executable
          sudo -n setpriv --bounding-set=-all,+dac_read_search,+net_admin,+sys_ptrace \
            "$test_binary" --exact \
            collector::tests::live_loopback_tcp_connection_is_visible_to_socket_collector

      - name: Audit dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2

      - name: Install cargo-audit when cache is cold
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked --version 0.22.2
          fi

      - name: Audit dependencies
        run: cargo audit

      - name: Build release binary
        run: cargo build --locked --release

      - name: Smoke-test Debian and RPM packages
        run: bash tests/package_artifacts.sh

      - name: Verify release binary and systemd unit
        run: |
          set -euo pipefail
          test -x target/release/screamless
          target/release/screamless --help >/dev/null
          sudo install -m 0755 target/release/screamless /usr/local/bin/screamless
          systemd-analyze verify packaging/screamless-agent.service
          sudo install -m 0644 packaging/screamless-agent.service /etc/systemd/system/screamless-agent.service
          sudo install -d -o root -g root -m 0750 /var/lib/screamless
          sudo systemctl daemon-reload
          cleanup() {
            status=$?
            sudo systemctl stop screamless-agent.service >/dev/null 2>&1 || true
            if ((status != 0)); then
              sudo journalctl -u screamless-agent.service --no-pager -n 100 || true
            fi
          }
          trap cleanup EXIT
          sudo systemctl start screamless-agent.service
          for attempt in {1..30}; do
            if sudo systemctl is-active --quiet screamless-agent.service; then
              if sudo test -s /var/lib/screamless/screamless.db; then
                break
              fi
            else
              sudo systemctl status --no-pager --full screamless-agent.service || true
              exit 1
            fi
            sleep 1
          done
          sudo systemctl is-active --quiet screamless-agent.service
          sudo test -s /var/lib/screamless/screamless.db
          sudo systemctl stop screamless-agent.service

  dashboard-browser:
    name: Dashboard drag interaction (Chromium and Firefox)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.96.0

      - name: Install browser-test dependencies
        run: npm ci

      - name: Audit browser-test dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Build dashboard CLI
        run: cargo build --locked --bin screamless

      - name: Exercise graph drag in both browsers
        run: SCREAMLESS_BIN=target/debug/screamless npm run test:browser

  msrv:
    name: MSRV (Rust 1.70)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.70.0

      - name: Check MSRV build
        run: cargo check --locked --all-targets

  arm64-release:
    name: Linux ARM64 build and archive smoke test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.96.0

      - name: Test and build ARM64 binary
        run: |
          test "$(uname -m)" = aarch64
          cargo test --locked --all-targets
          cargo build --locked --release
          readelf -h target/release/screamless | grep -Eq 'Machine:.*AArch64'
          target/release/screamless --help >/dev/null

      - name: Smoke-test ARM64 release archive layout
        run: |
          VERSION="${GITHUB_SHA::12}"
          mkdir -p "dist/screamless-${VERSION}"
          install -m 0755 target/release/screamless "dist/screamless-${VERSION}/screamless"
          install -m 0644 LICENSE CHANGELOG.md README.md packaging/screamless-agent.service "dist/screamless-${VERSION}/"
          install -m 0755 packaging/service-activation.sh "dist/screamless-${VERSION}/service-activation.sh"
          install -m 0755 packaging/render-service-unit.sh "dist/screamless-${VERSION}/render-service-unit.sh"
          install -m 0755 packaging/validate-service-install-dir.sh "dist/screamless-${VERSION}/validate-service-install-dir.sh"
          tar -C dist -czf "dist/screamless-${VERSION}-linux-arm64.tar.gz" "screamless-${VERSION}"
          tar -tzf "dist/screamless-${VERSION}-linux-arm64.tar.gz" | grep -q "screamless-${VERSION}/screamless"
          tar -tzf "dist/screamless-${VERSION}-linux-arm64.tar.gz" | grep -q "screamless-${VERSION}/service-activation.sh"
          tar -tzf "dist/screamless-${VERSION}-linux-arm64.tar.gz" | grep -q "screamless-${VERSION}/render-service-unit.sh"
          tar -tzf "dist/screamless-${VERSION}-linux-arm64.tar.gz" | grep -q "screamless-${VERSION}/validate-service-install-dir.sh"
          if tar -tzf "dist/screamless-${VERSION}-linux-arm64.tar.gz" | grep -E '(^|/)\.git(/|$)'; then
            echo "Git internals found in ARM64 archive" >&2
            exit 1
          fi
