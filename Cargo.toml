[package]
name = "screamless"
version = "1.1.0"
edition = "2021"
rust-version = "1.70"
description = "Linux dependency archaeology and decommission safety analysis"
readme = "README.md"
license = "MIT"
repository = "https://github.com/cyberducttape/ScreemLess"
homepage = "https://github.com/cyberducttape/ScreemLess"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
procfs = "0.15"
libc = "=0.2.189"
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "=1.44.2", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
regex = "1"
glob = "0.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
