name: screamless
arch: amd64
platform: linux
version: ${VERSION}
maintainer: Stephan Loesevitz <stephan.loesevitz@gmail.com>
description: Linux dependency archaeology and decommission evidence collector
license: MIT
contents:
  - src: ./target/release/screamless
    dst: /usr/local/bin/screamless
    file_info:
      mode: 0755
  - src: ./packaging/screamless-agent.service
    dst: /etc/systemd/system/screamless-agent.service
    file_info:
      mode: 0644
scripts:
  postinstall: ./packaging/postinstall.sh
